<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador Multiplayer</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        background: #111;
        font-family: Arial, sans-serif;
        overflow: hidden;
        display: flex;
        color: white;
    }

    /* --- SIDEBAR RANKING --- */
    #sidebar {
        width: 320px;
        background: #1a1a1a;
        border-right: 1px solid #333;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    .ranking-header {
        padding: 20px;
        background: #222;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        border-bottom: 1px solid #333;
    }

    #ranking-list {
        flex: 1;
        position: relative;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 10px;
    }

    #ranking-list::-webkit-scrollbar { width: 8px; }
    #ranking-list::-webkit-scrollbar-track { background: #1a1a1a; }
    #ranking-list::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

    .player-card {
        position: absolute;
        left: 10px;
        right: 10px;
        height: 60px;
        background: #252525;
        border-radius: 8px;
        display: flex;
        align-items: center;
        padding: 0 15px;
        transition: transform 0.4s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .player-pic {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        margin-right: 15px;
        border: 2px solid #4f8cff;
    }

    .player-name {
        flex: 1;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .player-clicks {
        font-weight: bold;
        color: #4f8cff;
        font-size: 16px;
    }

    /* --- CONTEÚDO PRINCIPAL --- */
    #main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- TOP RIGHT AUTH --- */
    #auth-container {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .profile-info {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
    }

    .profile-info img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #22c55e;
    }

    /* Botão Logout Alterado */
    .logout-btn {
        background: transparent;
        color: #ef4444;
        border: 1px solid #ef4444;
        padding: 2px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 10px;
        text-transform: uppercase;
        transition: all 0.2s;
        align-self: flex-end; /* Posiciona abaixo, alinhado à direita */
    }
    .logout-btn:hover { 
        background: #ef4444; 
        color: white;
    }

    /* --- BOTÃO E CONTADOR --- */
    .container { text-align: center; }

    #counter {
        font-size: 80px;
        font-weight: bold;
        color: white;
        margin-bottom: 30px;
        transition: transform .2s;
    }

    #btn {
        width: 180px;
        height: 180px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-size: 22px;
        font-weight: bold;
        background: linear-gradient(145deg, #4f8cff, #2563eb);
        color: white;
        box-shadow: 0 15px 40px rgba(0,0,0,.4);
        transition: transform .12s, box-shadow .12s, opacity 0.3s;
    }

    #btn:hover:not(:disabled) { transform: scale(1.05); }
    #btn:active:not(:disabled) { transform: scale(.95); }

    #btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        background: #555;
        box-shadow: none;
    }

    .bounce { animation: bounce .25s; }

    @keyframes bounce {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    .info {
        color: #888;
        margin-top: 20px;
        font-size: 14px;
    }
    .connected { color: #22c55e; }
    .disconnected { color: #ef4444; }
</style>
</head>
<body>

<div id="sidebar">
    <div class="ranking-header">Top Clickers</div>
    <div id="ranking-list"></div>
</div>

<div id="main-content">
    
    <div id="auth-container">
        <div id="google_btn"></div>
        
        <div id="user_profile" style="display: none; flex-direction: column; align-items: flex-end;">
            <div class="profile-info">
                <span id="user_name"></span>
                <img id="user_pic" src="" alt="Profile">
            </div>
            <button id="logout_btn" class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="counter">0</div>
        <button id="btn" disabled>CLICK</button>
        <div id="status" class="info disconnected">Conectando...</div>
        <div id="login-warning" style="color:#aaa; font-size:12px; margin-top:10px;">
            Faça login para clicar!
        </div>
    </div>
</div>

<script>
    const counter = document.getElementById("counter");
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    const rankingList = document.getElementById("ranking-list");
    const googleBtnDiv = document.getElementById("google_btn");
    const userProfileDiv = document.getElementById("user_profile");
    const userNameSpan = document.getElementById("user_name");
    const userPicImg = document.getElementById("user_pic");
    const loginWarning = document.getElementById("login-warning");

    let lastValue = null;
    let ws = null;
    let currentUser = null; 

    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(window.atob(base64));
        } catch (e) {
            return null;
        }
    }

    function handleCredentialResponse(response) {
        const data = parseJwt(response.credential);
        currentUser = {
            id: data.sub,
            name: data.name,
            picture: data.picture
        };
        localStorage.setItem("clicker_user", JSON.stringify(currentUser));
        updateAuthUI();
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem("clicker_user");
        updateAuthUI();
    }

    document.getElementById("logout_btn").onclick = logout;

    function updateAuthUI() {
        if (currentUser) {
            googleBtnDiv.style.display = "none";
            userProfileDiv.style.display = "flex";
            userNameSpan.textContent = currentUser.name;
            userPicImg.src = currentUser.picture;
            
            btn.disabled = false;
            loginWarning.style.display = "none";
        } else {
            googleBtnDiv.style.display = "block";
            userProfileDiv.style.display = "none";
            
            btn.disabled = true;
            loginWarning.style.display = "block";
        }
    }

    window.onload = function () {
        const savedUser = localStorage.getItem("clicker_user");
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            updateAuthUI();
        }

        google.accounts.id.initialize({
            client_id: "781462970668-3nar0k00da7hssqoqhd6pp5bj8hks0od.apps.googleusercontent.com", 
            callback: handleCredentialResponse
        });
        
        google.accounts.id.renderButton(
            googleBtnDiv,
            { theme: "outline", size: "large" }
        );

        connectWS();
    };

    function renderLeaderboard(leaderboardData) {
        const CARD_HEIGHT = 70; 
        rankingList.style.height = `${leaderboardData.length * CARD_HEIGHT}px`;

        leaderboardData.forEach((player, index) => {
            let card = document.getElementById(`player-${player.id}`);
            
            if (!card) {
                card = document.createElement("div");
                card.id = `player-${player.id}`;
                card.className = "player-card";
                
                card.innerHTML = `
                    <img class="player-pic" src="${player.picture}" alt="pic">
                    <div class="player-name">${player.name}</div>
                    <div class="player-clicks" id="clicks-${player.id}">${player.clicks}</div>
                `;
                rankingList.appendChild(card);
            } else {
                document.getElementById(`clicks-${player.id}`).textContent = player.clicks;
            }

            card.style.transform = `translateY(${index * CARD_HEIGHT}px)`;
        });
    }

    function bounce() {
        btn.classList.remove("bounce");
        void btn.offsetWidth;
        btn.classList.add("bounce");
    }

    function connectWS() {
        ws = new WebSocket("wss://contador-online.ionmateusoprea.workers.dev/ws");

        ws.onopen = () => {
            status.textContent = "Conectado";
            status.className = "info connected";
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                counter.textContent = data.count;
                if (lastValue !== null && data.count !== lastValue) {
                    bounce();
                }
                lastValue = data.count;

                if (data.leaderboard) {
                    renderLeaderboard(data.leaderboard);
                }
            } catch (err) {
                console.error(err);
            }
        };

        ws.onclose = () => {
            status.textContent = "Reconectando...";
            status.className = "info disconnected";
            setTimeout(connectWS, 1000);
        };

        ws.onerror = (err) => console.error(err);
    }

    btn.onclick = () => {
        if (!currentUser) return;

        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                action: "increment",
                user: currentUser
            }));
        }
    };
</script>
</body>
</html>
