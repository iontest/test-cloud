<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contador Multiplayer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
}

#counter{
    font-size:80px;
    font-weight:bold;
    color:white;
    margin-bottom:30px;
    transition:transform .2s;
}

button{
    width:180px;
    height:180px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-size:22px;
    font-weight:bold;

    background:
    linear-gradient(
        145deg,
        #4f8cff,
        #2563eb
    );

    color:white;

    box-shadow:
        0 15px 40px rgba(0,0,0,.4);

    transition:
        transform .12s,
        box-shadow .12s;
}

button:hover{
    transform:scale(1.05);
}

button:active{
    transform:scale(.95);
}

.bounce{
    animation:bounce .25s;
}

@keyframes bounce{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
    }
}

.info{
    color:#888;
    margin-top:20px;
    font-size:14px;
}

.connected{
    color:#22c55e;
}

.disconnected{
    color:#ef4444;
}

</style>
</head>
<body>

<div class="container">

    <div id="counter">0</div>

    <button id="btn">
        CLICK
    </button>

    <div
        id="status"
        class="info disconnected"
    >
        Conectando...
    </div>

</div>

<script>

const counter =
document.getElementById(
    "counter"
);

const btn =
document.getElementById(
    "btn"
);

const status =
document.getElementById(
    "status"
);

let lastValue = null;

function bounce(){

    btn.classList.remove(
        "bounce"
    );

    void btn.offsetWidth;

    btn.classList.add(
        "bounce"
    );
}

function connect(){

    const ws =
    new WebSocket(
        "wss://contador-online.ionmateusoprea.workers.dev/ws"
    );

    ws.onopen = ()=>{

        console.log(
            "WebSocket conectado"
        );

        status.textContent =
        "Conectado";

        status.className =
        "info connected";
    };

    ws.onmessage = (event)=>{

        try{

            const data =
            JSON.parse(
                event.data
            );

            counter.textContent =
            data.count;

            if(
                lastValue !== null &&
                data.count !== lastValue
            ){
                bounce();
            }

            lastValue =
            data.count;

        }catch(err){

            console.error(err);

        }
    };

    ws.onclose = ()=>{

        console.log(
            "Desconectado"
        );

        status.textContent =
        "Reconectando...";

        status.className =
        "info disconnected";

        setTimeout(
            connect,
            1000
        );
    };

    ws.onerror = (err)=>{

        console.error(err);

    };

    btn.onclick = ()=>{

        if(
            ws.readyState ===
            WebSocket.OPEN
        ){

            ws.send(
                JSON.stringify({
                    action:
                    "increment"
                })
            );

        }
    };
}

connect();

</script>

</body>
</html>
